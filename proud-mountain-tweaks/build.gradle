plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '2.6.1'
group = 'de.proudmountain'
base { archivesName = 'proud-mountain-tweaks' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.256'
    mods {
        proudmountain_tweaks { sourceSet sourceSets.main }
    }
}

repositories {
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    // Core NeoForge dependencies for effects and event system (already included by neoForge plugin)
    
    // Optional: Add additional farming mod dependencies if needed
    compileOnly 'maven.modrinth:serene-seasons:SPj5bJoM' // 10.1.0.3
    compileOnly 'maven.modrinth:glitchcore:S2TfWrZR' // 2.1.0.2
    
    // For NeoForge effect system - already included via neoForge plugin
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }