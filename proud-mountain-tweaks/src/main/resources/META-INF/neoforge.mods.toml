modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "proudmountain_tweaks"
version = "2.3.0"
displayName = "Proud Mountain Tweaks"
authors = "Tim"
description = '''
Anpassungen für das Modpack: Die Jahreszeiten von Serene Seasons folgen dem echten Kalender (Server).
Mitgelieferte Resource Packs werden einmal eingeschaltet und lassen sich danach abwählen (Client).
Elytren sind verbannt (Server).
Ladereihenfolge Farmer's Delight vor Coffee Delight.
'''
# Client und Server brauchen sie nicht gegenseitig
displayTest = "IGNORE_ALL_VERSION"

[[mixins]]
config = "proudmountain_tweaks.mixins.json"

[[dependencies.proudmountain_tweaks]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.proudmountain_tweaks]]
modId = "sereneseasons"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# Coffee Delight liest beim Registrieren Farmer's-Delight-Blöcke, deklariert die Reihenfolge aber nicht.
# Über diese Mod entsteht die Kette farmersdelight -> proudmountain_tweaks -> coffee_delight.
[[dependencies.proudmountain_tweaks]]
modId = "farmersdelight"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.proudmountain_tweaks]]
modId = "coffee_delight"
type = "optional"
versionRange = "*"
ordering = "BEFORE"
side = "BOTH"
